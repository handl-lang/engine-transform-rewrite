[package]
name = "hnl-engine-transform-rewrite"
version = "0.1.0"
edition = "2024"
description = "The first [`TransformEngine`] implementation (ADR-0094): a rule-interpreting rewriting engine that generalizes the legacy `handl-runtime::desugar_pass` machinery."
license = "MIT"
repository = "https://github.com/handl-lang/engine-transform-rewrite"
homepage = "https://handl-lang.github.io/docs/engine-transform-rewrite/"
documentation = "https://handl-lang.github.io/docs/engine-transform-rewrite/reference/"
readme = "README.md"
keywords = ["handl", "engine", "transform", "rewrite"]
categories = ["development-tools", "compilers"]
# Git-install only: https://github.com/handl-lang/engine-transform-rewrite (no crates.io).
publish = false

[dependencies]
handl-language = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-value = { git = "https://github.com/handl-lang/kernel", branch = "main" }
hnl-engine-transform = { git = "https://github.com/handl-lang/engine-transform", branch = "main" }
serde_json = "1"

[dev-dependencies]
handl-runtime = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-kit-data-prelude = { git = "https://github.com/handl-lang/kit-data-prelude", branch = "main" }
serde_json = "1"
criterion = "0.5"

[[bench]]
name = "transform"
harness = false
